name: Local Jarvis

# Syntax-check the laptop stack. Does not replace Validate.

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile local-jarvis Python
        run: python -m py_compile local-jarvis/*.py
