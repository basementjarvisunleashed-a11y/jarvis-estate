name: Links

# File links and HTTP 404/410 fail the job. Timeouts and flaky external
# status codes (403, 405, 408, 429, 5xx) are printed and do not fail it.
# Loopback URLs in the install docs are not fetched.

on:
  push:
    branches: [main]
  pull_request:

# SAF-09: least-privilege token for every job.
permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/lychee.tgz
          # SAF-09: verify the release before running it. This tag ships no
          # checksum file. The digest is sha256(lychee-x86_64-unknown-linux-gnu.tar.gz)
          # at lychee-v0.18.1, recomputed from a separate download of that asset.
          echo "0d48569e2dc11c1917fa98321dfd7aa675fba03b79f41e8e74afa3223e30d379  /tmp/lychee.tgz" | sha256sum -c -
          tar -xzf /tmp/lychee.tgz -C /tmp lychee
          /tmp/lychee --version
      - name: Check Markdown and HTML links
        run: |
          set +e
          /tmp/lychee \
            --no-progress \
            --max-retries 2 \
            --max-concurrency 8 \
            --timeout 20 \
            --exclude-loopback \
            --include-fragments \
            --format json \
            --output /tmp/lychee.json \
            '**/*.md' '**/*.html'
          python3 scripts/link-check-gate.py /tmp/lychee.json
