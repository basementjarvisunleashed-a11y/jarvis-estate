(***************************************************************************)
(* TLC configuration — Phase 1 model checking ("Prove illegal state        *)
(* transitions unreachable").                                               *)
(*                                                                         *)
(* Finite instance: two distinct actions (so MutateIntent can change the   *)
(* action field), singleton target/effect/scope, server now bounded by      *)
(* MaxNow, clock-skew bound Delta = 60s per ratified D7. DigestOf/Digests  *)
(* are concretized in the spec itself (field-tuple encoding, injective),   *)
(* because the TLC configuration parser cannot express operator constants  *)
(* or tuple/set-comprehension values.                                       *)
(***************************************************************************)
INIT Init
NEXT Next
INVARIANT SafetyInvs
PROPERTY PO11_TerminalAbsorbing
CONSTANTS
    Actions = { "a1", "a2" }
    Targets = { "t1" }
    Effects = { "e1" }
    Scopes = { "s1" }
    MaxNow = 6
    Delta = 60
