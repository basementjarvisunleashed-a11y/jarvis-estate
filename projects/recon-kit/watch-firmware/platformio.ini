; PlatformIO project for the T-Watch-S3 (SX1280 2.4 GHz) Jarvis off-grid node.
; Option B custom firmware. Skeleton -- may need library-version tweaks to build.
;
; Board: the T-Watch-S3 is an ESP32-S3 with 16MB flash / 8MB OPI PSRAM.
; We use the Espressif Arduino "T-Watch-S3" variant so the correct pins_arduino.h
; (display + SX1280 LoRa pins) is selected automatically.

[platformio]
extra_configs = secrets.ini       ; gitignored; MUST define JV_LORA_KEY + JV_INGEST_TOKEN or the build fails

[env:twatch-s3]
platform = espressif32
board = lilygo-t-watch-s3        ; TODO: if unknown to your PlatformIO, use board = esp32-s3-devkitc-1
                                 ;       and add -DARDUINO_LILYGO_T_WATCH_S3 plus the pin defines below.
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${secrets.build_flags}
    ; TFT_eSPI configured here (no User_Setup.h edits). ST7789 240x240.
    -DUSER_SETUP_LOADED=1 -DST7789_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=240
    -DTFT_CS=12 -DTFT_DC=38 -DTFT_MOSI=13 -DTFT_SCLK=18 -DTFT_RST=-1 -DTFT_BL=45
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=40000000 -DUSE_HSPI_PORT=1
    ; REQUIRED secrets (build FAILS without them) come from gitignored secrets.ini:
    ;   -DJV_LORA_KEY=\"<>=16 random chars>\" -DJV_INGEST_TOKEN=\"<per-device token>\"
    ;   optional: -DJV_WIFI_SSID/-DJV_WIFI_PASS -DJV_HEALTH_URL -DJV_INGEST_URL -DJV_HEALTH_URL_TS -DJV_INGEST_URL_TS
    ; If your board def lacks the variant pins, uncomment and set these
    ; (verified T-Watch-S3 values):
    ; -DLORA_CS=5 -DLORA_RST=8 -DLORA_BUSY=7 -DLORA_IRQ=9
    ; -DLORA_SCK=3 -DLORA_MISO=4 -DLORA_MOSI=1

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    jgromes/RadioLib                 ; SX1280 driver
    ; Display/touch/haptics for the T-Watch-S3. Pick ONE approach:
    ;  (a) LilyGo's official library (TTGO_TWatch_Library / LilyGoWatch):
    ; https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library
    ;  (b) raw TFT_eSPI + a touch lib + DRV2605 lib with explicit pins.
    bodmer/TFT_eSPI                  ; display (touch FT6336 read raw over I2C, no lib)
    adafruit/Adafruit DRV2605 Library ; haptic motor (I2C)

; NOTES:
;  - Verified T-Watch-S3 LoRa (SX1280) pins: CS=5 RST=8 BUSY=7 IRQ/DIO1=9
;    SCK=3 MISO=4 MOSI=1  (source: espressif arduino-esp32 variant pins_arduino.h)
;  - Display (ST7789): CS=12 DC=38 MOSI=13 SCK=18 RST=-1 BL=45, 240x240.
;  - Touch INT=16, I2C SDA=39 SCL=40.  Shared sensor I2C: SDA=10 SCL=11.
;  - DRV2605 haptic + AXP2101 PMU + BMA423 + PCF8563 share the SDA10/SCL11 bus.

; Recon Kit: Wi-Fi creds via a LOCAL gitignored file, never committed:
;  (extra_configs = secrets.ini is set in [platformio] at the top)
;   secrets.ini (gitignored) contents:
;     [secrets]
;     build_flags = -DJV_LORA_KEY=\"...\" -DJV_INGEST_TOKEN=\"...\" -DJV_WIFI_SSID=\"...\" -DJV_WIFI_PASS=\"...\"
